name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: TypeScript, Vitest, Playwright, Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install dependencies
        run: bun install
      - name: TypeScript
        run: bun run lint
      - name: Vitest
        run: bun run test
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Playwright
        run: bun run test:e2e
      - name: Build
        run: bun run build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
